<!DOCTYPE html>
<html>

<head>
    <title>Student Form</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <h1>Form Using Html And css</h1>

    <form>
        <label>Name:</label>
        <input type="text" placeholder="Enter Your Name">
        <br>
        <label>Email:</label>
        <input type="email" placeholder="1234@gmail.com">
        <br>

        <label>Mobile No:</label>
        <input type="number" placeholder="Enter Yor Mobile NO">
        <br>
        <label>Date Of Birth</label>
        <input type="date">
        <br>
        <br>

        <label>Gender</label>
        <div class="gender">
            <input type="radio" name="Gender" id="Male">
            <label>Male</label>

            <input type="radio" name="Gender" id="Female">
            <label>Female</label>

            <input type="radio" name="Gender" id="Other">
            <label>Other</label>

        </div>



        <label>Address:</label>
        <textarea rows="2" cols="30"></textarea>
        <br>

        <div class="formbtm">
            <input type="checkbox" class="checkboox">
            <label>I agree all the term and conditions</label>

        </div>

        <br>
        <button>Sumbit</button>


    </form>

</body>

</html>
